name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `floor` is the coverage percentage below which the build fails, set a
        # couple of points under what each add-on measures today. It is a
        # ratchet against regression, not a target: raise it when the real
        # number rises, and never lower it to make a red build go green.
        include:
          - addon: coop-tracker
            floor: 92
          - addon: gym-tracker
            floor: 90
          - addon: detection-hub
            floor: 88
          - addon: addon-watchdog
            floor: 92
          - addon: network-traffic
            floor: 92
          - addon: electricity-tracker
            floor: 90
          - addon: knowledge
            floor: 90
          - addon: journal
            floor: 90
          - addon: recipes
            floor: 92
    defaults:
      run:
        working-directory: ${{ matrix.addon }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ matrix.addon }}/app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=${{ matrix.floor }}

  lint-pipeline:
    # The data-pipeline add-ons wrap upstream images (no pytest). Lint their
    # config/build YAML and Dockerfiles instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint add-on YAML
        run: yamllint -d relaxed pipeline-*/config.yaml

      - name: Lint Dockerfiles (hadolint)
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --failure-threshold error pipeline-*/Dockerfile

      - name: Compile Python (DAGs + jobs)
        run: |
          python -m py_compile pipeline-airflow/dags/*.py \
                               pipeline-airflow/jobs/*.py \
                               pipeline-spark/jobs/*.py

  test-pipeline:
    # Its own job rather than the matrix above, which assumes an app/ directory.
    # Java is installed because the Spark tests are the only thing that exercises
    # the Delta MERGE, and they must not be quietly skipped here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline-airflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline-airflow/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # 55, from the 57% this step actually printed on CI with 35 tests and
        # nothing skipped — the setup-java step above means the Spark tests do
        # run here, so that figure is real rather than an artefact of a missing
        # JVM, which is what the note here used to assume.
        #
        # A wider buffer than the other add-ons get, because jobs/ is only 195
        # statements: one percentage point is two lines, so the usual single
        # point of headroom would trip on a trivial refactor.
        #
        # It is a low number and honestly so. jobs/example_job.py is at 0% and
        # jobs/lakehouse.py at 29%; both are real shipped code — example_job.py
        # is baked into the Spark image and spark-submitted by the example DAG,
        # not a fixture — so neither should be omitted to flatter the total.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=55

  # A real browser opening a real page. Every other front-end test in this repo
  # reads app.js as text and asserts a substring is present, which proves a line
  # was written and nothing about whether it runs — Electricity Tracker 1.18.0
  # shipped a call to an undefined helper that stopped the whole script, and a
  # page of dashes passed every one of them.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - coop-tracker
          - electricity-tracker
          - gym-tracker
          - recipes
          - journal
          - knowledge
    defaults:
      run:
        working-directory: ${{ matrix.addon }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ matrix.addon }}/app/requirements-e2e.txt

      - name: Install dependencies
        run: pip install -r app/requirements-e2e.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: pytest app/tests_e2e
