name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `floor` is the coverage percentage below which the build fails, set a
        # couple of points under what each add-on measures today. It is a
        # ratchet against regression, not a target: raise it when the real
        # number rises, and never lower it to make a red build go green.
        include:
          - addon: coop-tracker
            floor: 90
          - addon: gym-tracker
            floor: 88
          - addon: detection-hub
            floor: 88
          - addon: addon-watchdog
            floor: 91
          - addon: network-traffic
            floor: 92
          - addon: electricity-tracker
            floor: 87
          - addon: knowledge
            floor: 88
          - addon: journal
            floor: 88
    defaults:
      run:
        working-directory: ${{ matrix.addon }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ matrix.addon }}/app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=${{ matrix.floor }}

  lint-pipeline:
    # The data-pipeline add-ons wrap upstream images (no pytest). Lint their
    # config/build YAML and Dockerfiles instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint add-on YAML
        run: yamllint -d relaxed pipeline-*/config.yaml

      - name: Lint Dockerfiles (hadolint)
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --failure-threshold error pipeline-*/Dockerfile

      - name: Compile Python (DAGs + jobs)
        run: |
          python -m py_compile pipeline-airflow/dags/*.py \
                               pipeline-airflow/jobs/*.py \
                               pipeline-spark/jobs/*.py

  test-pipeline:
    # Its own job rather than the matrix above, which assumes an app/ directory.
    # Java is installed because the Spark tests are the only thing that exercises
    # the Delta MERGE, and they must not be quietly skipped here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline-airflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline-airflow/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Reported, not enforced. The Spark tests are what exercise most of
        # jobs/, and they only run where there is a JVM — so the honest floor
        # for this add-on is whatever this step first prints on CI, not a
        # number guessed from a laptop that skips them. Add --cov-fail-under
        # here once that figure is known.
        run: pytest --cov --cov-report=term-missing

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coop-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: coop-tracker/app/requirements-e2e.txt

      - name: Install dependencies
        run: pip install -r app/requirements-e2e.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: pytest app/tests_e2e
