name: "Goal Tracker"
version: "1.41.0"
slug: "gym-tracker"
description: "Track a weight/body-fat goal, home workouts, and a daily challenge with reminders"
url: "https://github.com/hoascv/homeassistant-addons/tree/main/gym-tracker"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
# Not published unless you set a port. Only needed to let something outside
# Home Assistant — a data pipeline — reach the API with api_token.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Direct API access for a data pipeline (requires api_token)"
panel_icon: mdi:dumbbell
panel_title: "Goal Tracker"
# Only Home Assistant admin-group users get the sidebar menu entry (the
# default, stated explicitly). See restrict_to_user_ids for a hard,
# per-user access block on top of that.
panel_admin: true
homeassistant_api: true
options:
  notify_service: ""
  challenge_reminder_enabled: false
  challenge_reminder_time: "18:00"
  weighin_reminder_enabled: false
  weighin_reminder_weekday: "sunday"
  weighin_reminder_time: "08:00"
  stoic_quote_enabled: true
  stoic_quote_time: "07:00"
  # Which meals to track, comma-separated. Free text because meal names are
  # personal — four meals, or calling the evening one "tea", is nobody's
  # business but yours. Renaming one keeps the history logged under the old
  # name; it is shown as retired rather than lost.
  meals: "Breakfast, Lunch, Dinner"
  restrict_to_user_ids: ""
  garmin_auto_sync: true
  garmin_sync_interval_hours: 6
  garmin_hr_window_minutes: 30
  garmin_backfill_days: 60
  api_token: ""
schema:
  notify_service: "str?"
  challenge_reminder_enabled: "bool"
  challenge_reminder_time: "str"
  weighin_reminder_enabled: "bool"
  weighin_reminder_weekday: "list(daily|monday|tuesday|wednesday|thursday|friday|saturday|sunday)"
  weighin_reminder_time: "str"
  stoic_quote_enabled: "bool"
  stoic_quote_time: "str"
  meals: "str?"
  restrict_to_user_ids: "str?"
  garmin_auto_sync: "bool"
  garmin_sync_interval_hours: "int(1,168)"
  garmin_hr_window_minutes: "int(5,180)"
  garmin_backfill_days: "int(7,730)"
  api_token: "str?"
