name: "Add-on Watchdog"
version: "1.1.0"
slug: "addon-watchdog"
description: "Health, resource use and update status for the add-ons in this repository"
url: "https://github.com/hoascv/homeassistant-addons/tree/main/addon-watchdog"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:heart-pulse
panel_title: "Watchdog"
panel_admin: true
# Listing other add-ons and reading their stats needs the manager role; there
# is no narrower one that can see past this add-on itself. Nothing here calls a
# write endpoint — see DOCS.md.
hassio_api: true
hassio_role: manager
# Only to publish the sensors. Off by default in options, and never read from.
homeassistant_api: true
options:
  scan_interval_seconds: 60
  probe_timeout_seconds: 5
  publish_sensors: true
  sensor_prefix: "addon_watchdog"
  ignore_stopped: true
schema:
  scan_interval_seconds: "int(15,3600)"
  probe_timeout_seconds: "int(1,60)"
  publish_sensors: "bool"
  sensor_prefix: "str"
  ignore_stopped: "bool"
