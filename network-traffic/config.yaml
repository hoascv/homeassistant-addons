name: "Network Traffic Monitor"
version: "0.2.0"
slug: "network-traffic"
description: "Full packet capture from the Home Assistant host, landed in the datalake for later investigation"
url: "https://github.com/hoascv/homeassistant-addons/tree/main/network-traffic"
arch:
  - aarch64
  - amd64
# services/manual, not application/auto: this is the one add-on that captures
# traffic beyond its own, and it should need a deliberate start rather than
# silently come alive on every host boot.
startup: services
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:network
panel_title: "Network Traffic"
# Only Home Assistant admin-group users get the sidebar entry (the default,
# set explicitly). See restrict_to_user_ids for a hard, per-user block on top
# of that — worth using here more than almost anywhere else in this repository.
panel_admin: true
# Sees the host's real interfaces rather than a namespaced virtual one, which
# is the entire point. First add-on in this repository to set either of the
# next two keys — read DOCS.md's Security section before starting it.
host_network: true
privileged:
  - NET_ADMIN   # the promiscuous-mode ioctl tcpdump issues by default
  - NET_RAW     # the AF_PACKET socket capture opens
# Read-write for one small file: /share/pipeline-status/network-traffic.json,
# the same convention detection-hub's hass.py uses so the Add-on Watchdog can
# see a dead capture process behind an otherwise-answering dashboard.
map:
  - share:rw
# Rotated pcaps are deleted locally right after a successful upload, and the
# unshipped backlog is capped at retention_files — but even that bounded
# buffer is binary capture data at full snaplen, which a Home Assistant
# backup should not have to carry, the same reasoning detection-hub's
# snapshots exclusion gives.
backup_exclude:
  - "pcap/**"
options:
  # "any" is tcpdump's pseudo-interface bundling every real one. A comma list
  # of real interface names narrows it.
  capture_interfaces: "any"
  # An optional tcpdump/BPF filter expression, e.g. "not port 22", to exclude
  # noisy or sensitive traffic. Empty means nothing is excluded.
  bpf_filter: ""
  # How often the running capture rotates to a new file. 1 hour of local
  # buffer at the default retention_files below — long enough to survive a
  # brief MinIO outage, short enough that an extended one does not quietly
  # fill the disk.
  rotate_seconds: 300
  # The local ring-buffer size, enforced by this add-on's own janitor loop
  # rather than tcpdump's -W (which some builds stop capturing entirely on,
  # rather than wrap, once the limit is hit).
  retention_files: 12
  # Bytes of each packet tcpdump keeps. 0 is tcpdump's own convention for "do
  # not truncate" — the point of full packet capture is seeing the content.
  snap_length: 0
  # The Supervisor bridge gateway, same address every other pipeline add-on
  # uses to reach Pipeline MinIO.
  minio_endpoint: "http://172.30.32.1:9000"
  minio_access_key: "minioadmin"
  minio_secret_key: "changeme"
  minio_bucket: "raw"
  minio_prefix: "network_traffic"
  # An S3 lifecycle (expiration) rule kept on the bucket, scoped to this
  # add-on's own prefix — MinIO deletes old captures on its own schedule
  # rather than this add-on tracking and deleting objects itself. 7 days is a
  # week of full packet capture, which for most home networks is enough to
  # investigate something noticed a few days late without keeping it forever.
  # 0 disables expiration (keep everything).
  datalake_retention_days: 7
  # Included in each uploaded object's key. Empty means the container
  # hostname, which is enough to tell captures apart if this add-on is ever
  # installed on more than one host.
  capture_label: ""
  restrict_to_user_ids: ""
schema:
  capture_interfaces: "str"
  bpf_filter: "str?"
  rotate_seconds: "int(30,3600)"
  retention_files: "int(1,288)"
  snap_length: "int(0,262144)"
  minio_endpoint: "str"
  minio_access_key: "str"
  minio_secret_key: "password"
  minio_bucket: "str"
  minio_prefix: "str"
  datalake_retention_days: "int(0,3650)"
  capture_label: "str?"
  restrict_to_user_ids: "str?"
