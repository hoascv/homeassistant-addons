name: "Detection Hub"
version: "1.6.0"
slug: "detection-hub"
description: "Object detection for Home Assistant — an image in, what's in it out"
url: "https://github.com/hoascv/homeassistant-addons/tree/main/detection-hub"
# amd64 only. The CPU budget assumes it, and while opencv does publish aarch64
# wheels, a Pi-class board cannot carry continuous detection — offering it there
# would be offering something that does not work.
arch:
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: "Detection Hub"
# Only Home Assistant admin-group users get the sidebar entry. This is the
# default, set explicitly to document intent — see restrict_to_user_ids for a
# hard per-user block.
panel_admin: true
# Not published unless you set a port. Only needed to let something outside Home
# Assistant — a data pipeline, or another add-on posting images — reach the API.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Direct API access for a pipeline or another add-on (requires api_token)"
homeassistant_api: true
# Read-write, for one small file: /share/pipeline-status/detection-hub.json,
# which is how the Add-on Watchdog learns that a capture thread died. An HTTP
# probe of this add-on cannot see that — the web UI answers perfectly well while
# a dead thread watches nothing.
map:
  - share:rw
# Snapshots are files under /data/snapshots, and they are deliberately NOT in
# backups. Measured at ~68 KB per 768x576 frame, the 2000-image default would
# put ~136 MB of pictures into every Home Assistant backup, forever — and a
# 1080p stream roughly four times that. The detections stay in the database and
# are backed up; a restore brings back every row and none of the images.
backup_exclude:
  - "snapshots/**"
options:
  api_token: ""
  restrict_to_user_ids: ""
  # 0.6, not lower: at 0.35 a dark post in the test frame scored 0.50 as a
  # person. A false alert at 3am costs more than a miss the next frame catches.
  confidence: 0.6
  # Empty means all 80 COCO classes. A camera almost always wants a handful —
  # the rest are noise that bury the ones you automate on.
  labels: "person, car, truck, bicycle, motorcycle, dog, cat, bird"
  # Empty uses the bundled YOLOX-Nano. Point at another ONNX to swap models;
  # it must be a YOLOX export at the same input size.
  model_path: ""
  # One camera per line, `name = url`. A textarea in the Supervisor UI, not
  # nested YAML: a typo in `name = url` is recoverable, a typo in nested YAML
  # rejects the whole configuration.
  #   drive = rtsp://user:pass@192.168.1.60:554/Streaming/Channels/102
  # Point at the camera's SUBSTREAM where it has one. Motion detection does not
  # need 4K, and decoding it is the single largest cost here.
  cameras: ""
  # Frames per second actually considered. Every frame is still read — a decoder
  # that is not drained backs up and starts handing over stale frames — but only
  # this many are examined. 0 means consider every frame.
  max_fps: 2
  # Fraction of the frame that must change before the detector is woken. This is
  # what makes continuous detection affordable: an unchanging scene costs a
  # cheap greyscale comparison instead of a forward pass. Raise it if a swaying
  # tree keeps triggering; lower it if slow movement is missed.
  motion_threshold: 0.005
  # Collapse repeats: log an object once while it stays in view, rather than
  # again and again. A parked car in a busy scene (wind, shifting light) keeps
  # tripping the motion gate and being re-detected; with this on, it is logged
  # once and stays quiet until it leaves. Turn off to log every detection.
  collapse_repeats: true
  # How long an object must be ABSENT from the frames the detector looks at
  # before a reappearance counts as new. While an object stays in view it is
  # logged once regardless of this; this only governs re-logging after it leaves.
  cooldown_seconds: 30
  ha_sensors_enabled: true
  ha_events_enabled: true
  sensor_prefix: "detection_hub"
  # The notify.* service for camera-offline alerts, WITHOUT the "notify."
  # prefix — e.g. "mobile_app_pixel". Empty means no push notifications; the
  # offline state still shows on the sensors and in the log regardless.
  notify_service: ""
  # How long a camera can go without delivering a frame before it counts as
  # offline. Covers a hung stream, not just a dropped connection — a frozen feed
  # whose thread never errors is exactly what a watchdog should catch.
  camera_offline_seconds: 120
  # Retention, bounded two ways because either alone fails: a quiet week keeps
  # images longer than intended, and a busy hour blows past any size
  # expectation well inside the age window. /data is inside Home Assistant's
  # backups, which is what makes the ceiling matter.
  detection_retention_days: 30
  snapshot_retention_days: 7
  snapshot_max_count: 2000
schema:
  api_token: "str?"
  restrict_to_user_ids: "str?"
  confidence: "float(0.05,0.99)"
  labels: "str?"
  model_path: "str?"
  cameras: "str?"
  max_fps: "float(0,30)"
  motion_threshold: "float(0,1)"
  collapse_repeats: "bool"
  cooldown_seconds: "int(0,3600)"
  ha_sensors_enabled: "bool"
  ha_events_enabled: "bool"
  sensor_prefix: "str"
  notify_service: "str?"
  camera_offline_seconds: "int(30,3600)"
  detection_retention_days: "int(1,3650)"
  snapshot_retention_days: "int(1,365)"
  snapshot_max_count: "int(0,100000)"
