name: "Electricity Tracker"
version: "1.13.0"
slug: "electricity-tracker"
description: "Danish electricity spot prices and your own smart-meter consumption, combined into what you actually pay"
url: "https://github.com/hoascv/homeassistant-addons/tree/main/electricity-tracker"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
# Not published unless you set a port. Only needed to let something outside
# Home Assistant — a data pipeline — reach the API with api_token.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Direct API access for a data pipeline (requires api_token)"
panel_icon: mdi:transmission-tower
panel_title: "Electricity"
# Only Home Assistant admin-group users get the sidebar menu entry (the
# default, stated explicitly). See restrict_to_user_ids for a hard,
# per-user access block on top of that.
panel_admin: true
homeassistant_api: true
options:
  price_area: "DK2"
  # Grid company net tariff, in DKK/kWh excl. VAT, split into up to three
  # time-of-day bands. These vary by grid company and change over time — look
  # yours up on your grid company's site (find it via eloverblik.dk) and enter
  # the current numbers. 0 means "not modelled" for that band.
  grid_tariff_low: 0.0
  grid_tariff_high: 0.0
  grid_tariff_normal: 0.0
  grid_tariff_low_start: "00:00"
  grid_tariff_low_end: "06:00"
  grid_tariff_high_start: "17:00"
  grid_tariff_high_end: "21:00"
  # High band only applies on these weekday numbers (1=Monday..7=Sunday) —
  # most Danish grid companies only charge peak rates on weekdays.
  grid_tariff_high_weekdays: "1,2,3,4,5"
  # High band only applies in these calendar months — most Danish grid
  # companies only charge a winter peak (Oct-Mar). Empty means all year.
  grid_tariff_high_months: "1,2,3,10,11,12"
  # Energinet's own system + transmission tariffs, combined into one flat
  # DKK/kWh number (both are flat, non-time-differentiated). Look the current
  # numbers up at energinet.dk/el/elmarkedet/tariffer.
  transmission_tariff: 0.0
  # Elafgift (Danish electricity tax), in DKK/kWh excl. VAT. Set by Parliament
  # and changed at the turn of most years — 2026/2027 rate is 0.008 (0.8 øre).
  electricity_tax: 0.008
  # What your supplier adds to the raw spot price, in DKK/kWh excl. VAT.
  # Energi Data Service publishes the market price; your bill shows spot plus
  # your supplier's margin, so without this every figure here sits a few øre
  # per kWh under what you actually pay. Read it off a bill by comparing its
  # energy line's average against the spot average for the same period.
  supplier_markup: 0.0
  # A standing charge that does not depend on consumption — the "Transport
  # fast" or abonnement line on a Danish bill — in DKK per month, excl. VAT.
  # A bill quoted per quarter is that figure divided by three. Never mixed into
  # the per-kWh price: it is added to the cost totals instead, and reported
  # separately, so a quiet day does not appear to have an absurd unit price.
  fixed_charge_monthly: 0.0
  # Danish VAT, applied on top of spot price + all tariffs + tax.
  vat_rate: 0.25
  eloverblik_refresh_token: ""
  eloverblik_metering_point: ""
  eloverblik_backfill_days: 30
  # A Saveeye Base HAN-port reader, if you have one: live instant power and
  # same-day hourly consumption, filling the gap while Eloverblik's official
  # figures are still 1-3 days behind. Off by default. Needs an MQTT broker —
  # the Home Assistant "Mosquitto broker" add-on is the easy path — with the
  # Saveeye app's own MQTT settings pointed at your Home Assistant host's LAN
  # address (not core-mosquitto — that name only resolves inside Supervisor's
  # own network, which the physical Base reader is not on). See DOCS.md.
  saveeye_enabled: false
  # This add-on's own connection to that broker, reached from inside
  # Supervisor — core-mosquitto is the official Mosquitto broker add-on's
  # fixed internal hostname, correct as long as that's the broker in use.
  saveeye_mqtt_host: "core-mosquitto"
  saveeye_mqtt_port: 1883
  saveeye_mqtt_username: ""
  saveeye_mqtt_password: ""
  saveeye_mqtt_topic: "saveeye/telemetry"
  # Empty accepts telemetry from any device on the topic — fine for the
  # common case of one Base reader. Set this (from /api/saveeye/now once
  # you're receiving telemetry) only if more than one ever publishes here.
  saveeye_device_serial: ""
  # An Easee Home charger, if you have one: read-only monitoring (status,
  # live power, session cost against the real price) — this add-on never
  # starts, stops or throttles charging. Off by default.
  easee_enabled: false
  # Your Easee account's own login — the cloud API authenticates with these
  # directly rather than an app-generated token, the same pattern Gym
  # Tracker uses for Garmin.
  easee_username: ""
  easee_password: ""
  # Leave empty to use the first charger on the account. Set this (from
  # /api/easee/diagnose) only if you have more than one.
  easee_charger_id: ""
  restrict_to_user_ids: ""
  api_token: ""
schema:
  price_area: "list(DK1|DK2)"
  grid_tariff_low: "float(0,50)"
  grid_tariff_high: "float(0,50)"
  grid_tariff_normal: "float(0,50)"
  grid_tariff_low_start: "str"
  grid_tariff_low_end: "str"
  grid_tariff_high_start: "str"
  grid_tariff_high_end: "str"
  grid_tariff_high_weekdays: "str"
  grid_tariff_high_months: "str?"
  transmission_tariff: "float(0,50)"
  electricity_tax: "float(0,50)"
  supplier_markup: "float(0,10)"
  fixed_charge_monthly: "float(0,10000)"
  vat_rate: "float(0,1)"
  eloverblik_refresh_token: "password?"
  eloverblik_metering_point: "str?"
  eloverblik_backfill_days: "int(1,730)"
  saveeye_enabled: "bool"
  saveeye_mqtt_host: "str"
  saveeye_mqtt_port: "int(1,65535)"
  saveeye_mqtt_username: "str?"
  saveeye_mqtt_password: "password?"
  saveeye_mqtt_topic: "str"
  saveeye_device_serial: "str?"
  easee_enabled: "bool"
  easee_username: "str?"
  easee_password: "password?"
  easee_charger_id: "str?"
  restrict_to_user_ids: "str?"
  api_token: "str?"
