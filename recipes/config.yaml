name: "Recipes"
version: "1.2.0"
slug: "recipes"
description: "A recipe and snack catalog that builds a Danish supermarket list, with recipes loaded from any LLM without the add-on ever going online"
url: "https://github.com/hoascv/homeassistant-addons/tree/main/recipes"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:chef-hat
panel_title: "Recipes"
# Admin-group users only by default, narrowable per user below.
panel_admin: true
homeassistant_api: false
options:
  # Which categories exist, comma-separated. Free text: these two are only what
  # the add-on ships seeded for, and a household wanting "Quick" or "Guests"
  # should not have to argue with it.
  categories: "Family, Bulk"
  # Household size. Recipes are scaled to this when added to the list, so the
  # quantities on the shopping list are the ones you actually need to buy.
  default_servings: 4
  # Things always in the cupboard, comma-separated. Written as the Danish shelf
  # labels, because that is what the shopping list matches them against. They
  # still appear on the list but greyed out, so it does not open with eight
  # things you already own.
  staples: "salt, peber, olivenolie, rapsolie, hvedemel, sukker, bagepulver, eddike"
  restrict_to_user_ids: ""
schema:
  categories: "str?"
  default_servings: "int(1,12)"
  staples: "str?"
  restrict_to_user_ids: "str?"
