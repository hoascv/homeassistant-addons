name: "Coop Tracker"
version: "1.49.0"
slug: "coop-tracker"
description: "Log egg collection, coop cleaning, and feeding for your chickens"
url: "https://github.com/hoascv/homeassistant-addons/tree/main/coop-tracker"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
# Not published unless you set a port. Only needed to let something outside
# Home Assistant — a data pipeline — reach the API with api_token.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Direct API access for a data pipeline (requires api_token)"
panel_icon: mdi:egg
panel_title: "Coop Tracker"
# Only Home Assistant admin-group users get the sidebar menu entry. This
# is the default, but set explicitly to document intent — see also
# restrict_to_user_ids below for a hard, per-user access block.
panel_admin: true
homeassistant_api: true
options:
  currency: "DKK"
  reminder_enabled: false
  reminder_check_time: "18:00"
  reminder_threshold_days: 2
  notify_service: ""
  ha_sensors_enabled: false
  # Fermented feed. Off by default: it adds a card and a second reminder, and
  # neither is any use to somebody not fermenting.
  ferment_enabled: false
  # How long a batch sits before it is ready. Three days is the usual answer at
  # room temperature; a cold utility room in February wants longer.
  ferment_days: 3
  # How long a batch may go unstirred before the reminder counts it as due.
  # Twelve hours produces the usual twice-a-day rhythm.
  ferment_stir_hours: 12
  # When to send stir reminders, comma-separated. Times of day rather than an
  # interval, because "every 12 hours" lands at 3am half the time and a
  # notification nobody can act on is one you learn to ignore.
  ferment_stir_times: "08:00, 20:00"
  # Where stir reminders go. Blank falls back to notify_service, so the common
  # case needs no second setting; fermenting is a twice-a-day job and egg
  # collection a once-a-day one, so a household may want them on different
  # phones.
  ferment_notify_service: ""
  # How long a batch stays good to feed from, counted from the day it was
  # mixed. Past this it is spent: the culture has run out of sugar and stopped
  # holding the spoilage organisms back, and the tub still looks fine.
  ferment_max_age_days: 11
  flock_isabrown_count: 3
  flock_sussex_count: 2
  supermarket_egg_price: 2.5
  advanced_forecast_enabled: false
  egg_vision_enabled: false
  egg_vision_training_enabled: false
  egg_vision_training_retention_count: 200
  restrict_to_user_ids: ""
  api_token: ""
schema:
  currency: "list(USD|EUR|GBP|DKK|SEK|NOK|CHF|CAD|AUD|JPY)"
  reminder_enabled: "bool"
  reminder_check_time: "str"
  reminder_threshold_days: "int(1,30)"
  notify_service: "str?"
  ha_sensors_enabled: "bool"
  ferment_enabled: "bool"
  ferment_days: "int(1,14)"
  ferment_stir_hours: "int(2,48)"
  ferment_stir_times: "str?"
  ferment_notify_service: "str?"
  ferment_max_age_days: "int(2,60)"
  flock_isabrown_count: "int(0,100)"
  flock_sussex_count: "int(0,100)"
  supermarket_egg_price: "float(0,100)"
  advanced_forecast_enabled: "bool"
  egg_vision_enabled: "bool"
  egg_vision_training_enabled: "bool"
  egg_vision_training_retention_count: "int(20,500)"
  restrict_to_user_ids: "str?"
  api_token: "str?"
