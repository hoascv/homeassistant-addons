name: "Pulse Runner"
version: "0.1.0"
slug: "pulse-runner"
description: "An original rhythm precision-platformer: tap to the beat, dodge hazards, build your own levels"
url: "https://github.com/hoascv/homeassistant-addons/tree/main/pulse-runner"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:run-fast
panel_title: "Pulse Runner"
# Only Home Assistant admin-group users get the sidebar menu entry (the
# default, stated explicitly). See restrict_to_user_ids for a hard,
# per-user access block on top of that.
panel_admin: true
options:
  restrict_to_user_ids: ""
  audio_cleanup_interval_hours: 6
schema:
  restrict_to_user_ids: "str?"
  audio_cleanup_interval_hours: "int(1,168)"
