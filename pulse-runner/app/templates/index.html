<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pulse Runner</title>
<link rel="stylesheet" href="static/style.css?v={{ app_version }}">
</head>
<body>
<header class="topbar">
  <span class="topbar-icon">⚡</span>
  <h1>Pulse Runner</h1>
</header>

<main class="page">

  <!-- Level list -->
  <section class="screen" id="screen-menu">
    <p class="empty-state" id="level-list-empty" hidden>No levels yet.</p>
    <ul class="level-list" id="level-list"></ul>
  </section>

  <!-- Play screen: canvas + HUD -->
  <section class="screen" id="screen-play" hidden>
    <div class="play-head">
      <button type="button" class="link-btn" id="play-back-btn">&larr; Levels</button>
      <span class="hud-pill" id="hud-pct">0%</span>
      <span class="hud-pill" id="hud-attempts">Attempt 1</span>
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
      <p class="hud-message" id="hud-message">Tap to start</p>
    </div>
  </section>

</main>

<div class="toast" id="toast" hidden></div>

<script src="static/app.js?v={{ app_version }}"></script>
</body>
</html>
